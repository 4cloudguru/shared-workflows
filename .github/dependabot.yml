# The workflows here pin every action by full SHA, which is correct and is also
# why this file is not optional: a SHA pin never updates itself, so without
# Dependabot the pins rot silently and this repo becomes the estate's oldest
# action versions while looking deliberate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release is not proposed until it has existed for a week.
    #
    # zizmor flags the absence of this, and is right to point it at THIS repo in
    # particular: every action here is pinned by SHA and executes inside six
    # other repositories' CI. Without a cooldown, a compromised upstream release
    # reaches a pull request here within hours of publication, and the reviewer
    # is looking at a SHA bump with no signal that the version is brand new.
    # Seven days is not a guarantee; it is the window in which a hijacked
    # release is usually withdrawn.
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # npm (.github/actions/commit-message-check: the parser the gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # This entry MOVED here with the action itself. It previously existed in each
  # of the thirteen consumers, one copy per hand-copied gate, and deleting those
  # copies without adding this one would have left the pin covered by nobody --
  # the exact silence that makes a SHA pin rot while looking deliberate.
  #
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/actions/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      commit-message-check:
        patterns:
          - "*"
    cooldown:
      default-days: 7
