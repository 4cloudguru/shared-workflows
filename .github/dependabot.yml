# The workflows here pin every action by full SHA, which is correct and is also
# why this file is not optional: a SHA pin never updates itself, so without
# Dependabot the pins rot silently and this repo becomes the estate's oldest
# action versions while looking deliberate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release is not proposed until it has existed for a week.
    #
    # zizmor flags the absence of this, and is right to point it at THIS repo in
    # particular: every action here is pinned by SHA and executes inside six
    # other repositories' CI. Without a cooldown, a compromised upstream release
    # reaches a pull request here within hours of publication, and the reviewer
    # is looking at a SHA bump with no signal that the version is brand new.
    # Seven days is not a guarantee; it is the window in which a hijacked
    # release is usually withdrawn.
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
