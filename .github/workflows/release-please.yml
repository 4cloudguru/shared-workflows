---
# Reusable release-please job, shared across the Terraform suite and the
# pipeline-task families.
#
# WHY THIS EXISTS
#
# release-please.yml existed in TWELVE repositories across two owners. Stripped
# of comments it was 27 lines, and there were seven distinct versions of it --
# but the variation was not need, it was drift. Every copy used the same
# config-file, the same manifest-file, the same App id variable and the same
# App key secret. The ONLY substantive difference was the permission model:
#
#   least-privilege (7 repos)  contents: read at the workflow, elevated to
#                              contents/pull-requests write ON THE TOKEN STEP
#   broad           (5 repos)  contents: write for the whole workflow
#
# Nobody decided the five should be more permissive. Somebody tightened it in
# one family and the other five never heard -- the same shape as the egress fix
# that reached one of three HTTP clients, the carrier fix that reached one of
# three dev-admin seeds, and the tfx validation fix that would have reached one
# of three extensions. This file is the least-privilege model, so calling it
# carries the improvement rather than re-deriving it.
#
# CALLING IT
#
#   jobs:
#     release-please:
#       uses: 4cloudguru/shared-workflows/.github/workflows/release-please.yml@<sha>
#       secrets:
#         RELEASE_DISPATCH_APP_KEY: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
#
# Name the secret. `secrets: inherit` forwards EVERY secret in the calling
# repository to a workflow in another owner's repository -- zizmor flags it
# (secrets-inherit), and it is a strange over-grant to introduce through a
# workflow whose purpose is least privilege. The first draft of this did
# exactly that and the linter caught it.
#
# Pin by SHA, not by a moving ref. A shared workflow is itself a thing that can
# drift -- repos on different pins is the same defect wearing a new hat, and
# HARDER to see than divergent files, because every repo looks like it is using
# "the shared one". That is what the pin-parity signature is for.
#
# `vars` resolves against the CALLER's repository, so RELEASE_DISPATCH_APP_ID
# stays per-repo and nothing about the App installation changes here.
name: Release Please (reusable)

on:
  workflow_call:
    inputs:
      config-file:
        description: release-please config path, relative to the caller's repo root.
        type: string
        default: .release-please-config.json
      manifest-file:
        description: release-please manifest path, relative to the caller's repo root.
        type: string
        default: .release-please-manifest.json
    secrets:
      RELEASE_DISPATCH_APP_KEY:
        description: >-
          The GitHub App private key. Declared by its real name rather than
          aliased so the caller can pass it explicitly by that name, and so
          actionlint can type-check the reference below -- a reusable workflow
          only has the secrets it DECLARES in scope, so an undeclared fallback
          reference would never resolve at runtime even though it reads fine.
        required: true

# Least privilege at the workflow. The token step below elevates only what
# release-please actually needs, on the one step that needs it.
permissions:
  contents: read

# Concurrency groups are REPOSITORY-scoped, so this serialises release-please
# per calling repo rather than across the estate. cancel-in-progress is false
# deliberately: release-please opens and updates a release PR and pushes tags,
# and cancelling it midway can leave the manifest and the PR disagreeing.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # This job mints an App token that can write contents and pull requests. A
    # hung run holding that is worse than a failed one.
    timeout-minutes: 15
    steps:
      # Egress audit, carried UP from the callers rather than dropped.
      #
      # Three of the four 4cloudguru repos already ran harden-runner in their
      # local release-please; the five sethbacon repos never did. Converting
      # those three to a shared definition that lacked it would have SILENTLY
      # REGRESSED them -- the consolidation quietly removing a control the repo
      # already had. Folding it in here instead means all nine gain it.
      #
      # Pinned to v2.21.0 (05e3151), the newer of the two pins in circulation:
      # the estate currently runs 61 uses of v2.20.1 and 21 of v2.21.0, which is
      # its own drift and its own problem, but a shared definition should not
      # adopt the older one.
      #
      # `audit` rather than `block`: this is the first time these five repos run
      # it at all, and a blocking egress policy on a job that talks to the
      # GitHub API and npm would fail closed on day one. Audit produces the
      # baseline a block policy would need.
      # hardening-exception: egress-audit — runs only shell against the checkout, so
      #   its egress is already minimal, but harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Fail with an actionable message rather than a 401/422 out of the token
      # step. This matters MORE in a shared workflow than it did in the single
      # repo this was carried up from: a repo adopting this definition without
      # the App installed is now a routine onboarding mistake, not a one-off,
      # and "Bad credentials" does not tell anyone which knob to turn.
      #
      # This checks only that the values are PRESENT. A wrong-but-present key
      # still fails at the mint below, which is the correct place for it -- this
      # step is for the empty case, which is the common one.
      - name: Verify the release App credentials are configured
        env:
          APP_ID: ${{ vars.RELEASE_DISPATCH_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error::Missing release App credentials. Set the repository variable RELEASE_DISPATCH_APP_ID and the repository secret RELEASE_DISPATCH_APP_KEY, and install that App on this repository with contents:write and pull-requests:write."
            exit 1
          fi

      - name: Get GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.RELEASE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
          # Scope the installation token to exactly what release-please needs
          # (open/update the release PR + push the version-bump commit/tag)
          # instead of inheriting the app's blanket installation permissions.
          #
          # NOTE: the shared App installation is NOT granted the `issues`
          # permission, so requesting permission-issues here would 422 the token
          # step and break release-please entirely. That was tried and reverted
          # once already (registry-backend #261 -> #262); do not re-add it.
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
