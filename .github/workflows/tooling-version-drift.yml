---
# actionlint and zizmor are pinned in workflow-security.yml, and the osv-scanner
# image is pinned in .github/actions/osv-scan/action.yml. None of the three is a
# dependency any package manager tracks -- so nothing proposes an upgrade and a
# pin only moves if somebody remembers.
#
# The osv-scanner pin is here because it went unwatched for months
# (sethbacon/terraform-registry-backend#894): it lived in eight consumers'
# weekly-security.yml, one of them fell two releases behind, and the only thing
# that found out was a manual sweep. Dependabot cannot see it either way -- the
# github-actions ecosystem reads `uses:` clauses, and this reference is a
# `docker run` argument inside a composite action's shell.
#
# azure-pipelines-terraform used to watch this with a weekly canary that grepped
# its OWN unit-test.yml. Migrating that repo onto the shared workflow removed the
# pins it was reading, so the canary went with them: its next run would have
# failed with "Could not resolve the actionlint version pinned in unit-test.yml"
# (#23). The check belongs where the pins now live, and one job here covers every
# consumer at once -- which matters more than it did before, because a zizmor
# bump changes what a REQUIRED check enforces in all of them simultaneously.
#
# Scheduled only, plus manual. Not on pull_request: a new upstream release would
# then fail pull requests that have nothing to do with it. The reader's own logic
# IS gated per-PR, by the self-test in self-check.yml.
name: Tooling Version Drift

"on":
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tooling-version-drift:
    name: Tooling version drift (actionlint, zizmor, osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job queries the GitHub releases
      #   API and PyPI for the latest published versions, resolves a tag to a
      #   digest against ghcr.io, and clones this repository; harden-runner has
      #   never run in this repository, so no
      #   endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exit 2 is could-not-reach-upstream, and is deliberately NOT exit 0: a
      # canary that could not ask has not found the pins current.
      - name: Compare the pinned versions against their latest releases
        run: node scripts/check-tooling-pins.cjs
