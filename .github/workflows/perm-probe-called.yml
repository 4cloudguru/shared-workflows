---
# EXPERIMENT, not a shipped workflow. Settles issue #18's blocker.
#
# QUESTION: when a called reusable workflow contains a job that requests MORE
# permission than the caller grants, but that job is skipped by `if:`, is the
# request validated at PARSE time (the whole run fails at startup) or at RUN
# time (the job simply skips and everything else proceeds)?
#
# It decides whether an opt-in `record-in-security-tab` job is safe to add to
# workflow-security.yml for the callers that do NOT grant security-events:write.
# Guessing wrong fails every consumer at startup -- and a startup failure runs no
# jobs, so it cannot fail a required check either.
name: perm-probe-called

on:
  workflow_call:
    inputs:
      enable-elevated:
        description: Whether the elevated job should run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Proves the run started at all.
  baseline:
    name: baseline (no elevated permission)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report
        run: echo "baseline ran; the workflow was accepted at startup"

  # Requests MORE than the caller grants, and is skipped.
  elevated:
    name: elevated (security-events write, skipped)
    if: inputs.enable-elevated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Report
        run: echo "elevated ran -- NOT expected in this experiment"
