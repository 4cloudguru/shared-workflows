---
# Reusable workflow-security lint: zizmor (security) + actionlint (schema).
#
# WHY BOTH, AND WHY TOGETHER
#
# zizmor lints workflows for SECURITY -- credential persistence, template
# injection, over-broad permissions, unpinned actions. It does not check that a
# workflow is a VALID GitHub Actions file, and that gap shipped a real outage:
# removing a key left an empty `with:` behind, which is a schema error, and five
# workflows across three repositories failed at STARTUP -- zero jobs, no logs,
# and a run listed by file path instead of name because GitHub could not parse
# far enough to read it. Both yaml.safe_load and zizmor accepted the file.
#
# A startup failure runs no jobs, so it cannot fail a required check either.
# Nothing in the pipeline was in a position to notice. The two jobs belong
# together because each is blind to what the other sees.
#
# WHY IT IS SHARED
#
# This file existed in six repositories. All six were byte-identical except for
# ONE WORD in a comment -- and the odd copy was the correct one: it named
# `cloud-suite-ui`, the repo that actually exists, while the other five named
# `terraform-suite-ui`, which does not. Six copies, 77 lines, zero functional
# variation, and the only divergence was a stale name propagating by copy.
#
# CALLING IT
#
#   jobs:
#     workflow-security:
#       uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security.yml@<sha>
#
# No secrets and no inputs, so nothing is passed. Keep the triggers and the
# concurrency group in the caller: they read `github.event_name` and
# `github.head_ref`, which resolve to the caller's context, and leaving them
# visible in each repo is what makes it obvious the lint actually runs there.
name: Workflow Security (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: |
          The commit to scan. Defaults to the ref that triggered the run.

          A caller validating a SPECIFIC commit -- a release job checking the
          artefact it is about to publish -- has to pass it. Without it the scan
          reads whatever the run's default checkout resolves to, which is
          usually the same commit and not reliably so.
        required: false
        type: string

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor (workflow security lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Named rather than left to the action's `latest` default. `latest` is
          # safe -- it is an alias inside a digest table frozen by the action's
          # own SHA pin, not a tag resolved at runtime -- but it is illegible:
          # the scanner version would appear nowhere in this repository, and
          # bumping the action SHA would silently change which zizmor runs while
          # the diff showed only an action bump. A zizmor change alters what a
          # required check enforces in every consumer at once, so it should be a
          # reviewable line rather than a side effect.
          version: "1.30.0"
          # DO NOT "simplify" this to the default. `advanced-security: true` is
          # the action's default and selects `--format=sarif`, where zizmor
          # EXITS 0 WHATEVER IT FINDS -- the gate silently becomes a reporter.
          # A repository that took the default had a green required check
          # sitting on four error-severity findings for as long as they existed
          # (sethbacon/azure-pipelines-release-docs#79: the job log reads
          # `::debug::zizmor exited with code 0` beside ten open alerts).
          #
          # SARIF upload to code scanning needs security-events: write, which
          # this job deliberately does not hold. Findings surface as annotations
          # on the diff instead, which is where the person who can fix them is.
          # A caller that also wants them recorded durably calls
          # workflow-security-record.yml alongside this file; it cannot be an
          # input here, for the reason written at the top of that file.
          advanced-security: false
          annotations: true

  actionlint:
    name: Workflow schema (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install actionlint
        # Downloads the release asset and verifies it against actionlint's own
        # published SHA256 before extracting, rather than the convenience
        # install script -- that script pipes curl straight into tar with NO
        # integrity check at all, which is what this job used to do.
        #
        # That is a poor look in the workflow whose entire job is auditing
        # workflow security, and azure-pipelines-terraform had already refused
        # it: that repository runs its own zizmor and actionlint precisely
        # because this shared definition was weaker than its local one. This
        # change is that repo's convention carried UP, so every caller gets it
        # instead of one repo keeping it.
        #
        # Checksum from actionlint's published checksums.txt for v1.7.12
        # (linux_amd64, matching this job's ubuntu-latest runner), verified
        # against the release rather than copied on trust:
        # https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint

      - name: actionlint
        run: |
          set -euo pipefail
          # shellcheck/pyflakes are separate concerns and not installed here; the
          # schema check is the part that prevents a startup failure.
          ./actionlint -shellcheck= -pyflakes= -color

      # Same contract this repository applies to its node gates: prove the linter
      # still rejects something before believing its green. The fixture lives
      # outside the checkout so the run above never sees it, and it carries a
      # defect zizmor does not look for -- an unknown runner label.
      - name: actionlint enumerates every defect class it claims to catch
        shell: bash
        run: |
          set -euo pipefail

          # WHY THIS PLANTS FIVE DEFECTS AND CHECKS THE NAMES, not one and the
          # exit code. The earlier version of this step planted a single unknown
          # runner label and asserted only that actionlint exited non-zero. That
          # catches a linter which always passes; it cannot catch one that fails
          # this fixture while being blind to a rule class the estate depends on
          # -- and a selectively blind linter produces exactly the run record a
          # working one does. It is the estate's own signature-blind-vs-clean
          # lesson: exit 0 is meaningless until you check the ENUMERATED set, so
          # a non-zero exit is too.
          #
          # This matters more the moment the linter is not the one that has been
          # in place for years: whatever binary this step installs, a green gate
          # now means "it found all five", not "it exited non-zero".
          work="$(mktemp -d)"
          mkdir -p "$work/.github/workflows"
          cat > "$work/.github/workflows/broken.yml" <<'YAML'
          name: broken
          on: push
          jobs:
            bad-runner:
              runs-on: ubunut-latest
              steps:
                - run: echo hello
            bad-needs:
              runs-on: ubuntu-latest
              needs: [nonexistent-job]
              steps:
                - run: echo hello
            bad-shell:
              runs-on: ubuntu-latest
              steps:
                - run: echo hello
                  shell: notashell
          YAML

          # The expression defect is appended rather than written in the heredoc
          # above, and the dollar is emitted as \x24 on purpose. An expression
          # opener written literally -- dollar followed by two braces -- is
          # substituted by Actions ANYWHERE in a `run:` body, comments included,
          # before bash ever sees the line. The fixture would then reach
          # actionlint with the expression already replaced by an empty string,
          # the [expression] rule would never fire, and this step would fail for
          # a reason indistinguishable from the linter being blind. (Writing one
          # in this comment is how that was discovered: actionlint rejected this
          # very file.)
          printf '  bad-expression:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo "\x24{{ github.evnt_name }}"\n' \
            >> "$work/.github/workflows/broken.yml"

          # The unpinned-action defect is appended for a DIFFERENT reason, and it
          # is worth stating so nobody folds it back into the heredoc. The
          # fixture needs a `uses:` with no ref to exercise actionlint's [action]
          # rule -- but workflow-hardening.yml greps this file for `uses:` lines
          # and cannot tell a real reference from one inside a heredoc, so a
          # literal one here fails THIS repository's own pinning gate. Building
          # the line at runtime keeps the fixture honest and the gate satisfied.
          printf '  bad-action-ref:\n    runs-on: ubuntu-latest\n    steps:\n      - %s actions/setup-node\n' 'uses:' \
            >> "$work/.github/workflows/broken.yml"

          set +e
          out="$(./actionlint -shellcheck= -pyflakes= -no-color "$work/.github/workflows/broken.yml" 2>&1)"
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "::error title=actionlint proves nothing::It accepted a workflow carrying five distinct defects."
            exit 1
          fi

          missing=""
          for rule in runner-label job-needs action shell-name expression; do
            case "$out" in *"[$rule]"*) ;; *) missing="$missing $rule" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error title=actionlint is selectively blind::It rejected the fixture but never reported:$missing. A linter that exits non-zero while ignoring a rule class looks exactly like a working one."
            printf '%s\n' "$out"
            exit 1
          fi
          echo "actionlint enumerated all five planted defect classes, as a working linter must."
