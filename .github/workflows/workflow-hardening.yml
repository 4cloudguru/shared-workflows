---
# Workflow-hardening gate, shared.
#
# Asserts that a caller's workflows enforce four properties rather than merely
# conventionally having them: every `uses:` pinned to a full SHA and LABELLED
# with the version that SHA is; every job declaring a timeout; harden-runner
# present and ahead of any other action; npm installs run with --ignore-scripts.
#
# WHY THIS IS SHARED. It existed in ONE of the fourteen repos
# (azure-pipelines-release-docs) and caught a real defect the moment a shared
# workflow pin reached it -- an unlabelled 40-hex SHA that the other twelve
# repos had accepted without complaint. A gate that lives in one repo only
# protects one repo, and the estate has repeatedly found that the repo holding
# the improvement is not the repo that needs it.
#
# It reports what it ENUMERATED as well as what it found, because a gate that
# scanned nothing exits 0 exactly like a gate that scanned everything and
# approved. Read the enumerated line before believing the verdict.

on:
  workflow_call:
    inputs:
      script-ref:
        description: >-
          Commit of 4cloudguru/shared-workflows to take the checker from.

          LEAVE THIS UNSET. It now defaults to `github.job_workflow_sha`, which
          IS the commit this workflow was resolved at, so the checker and the
          workflow cannot disagree and there is no second pin for a bot to
          half-update. Passing it explicitly is still accepted for callers that
          have not dropped it yet, and is verified against the resolved commit
          rather than trusted.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  workflow-hardening:
    name: Workflow hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # REQUIRED, not defaulted. A default would have to name a literal commit,
      # and the only commit available to write is the one BEFORE the change that
      # adds the checker -- so the default would point at a tree where
      # scripts/check-workflow-hardening.cjs does not exist, and every caller
      # would fail on a file-not-found. Defaulting to a branch instead would
      # make the gate mutable, which is the opposite of what pinning is for.
      #
      # The checker is taken from shared-workflows at a pinned commit rather
      # than from the caller, so a repo cannot weaken its own gate by editing
      # its copy -- which is the failure mode of shipping the script into
      # fourteen repos.
      # WHY THIS STEP EXISTS AT ALL: `script-ref` used to be a required input
      # naming the same commit as the caller's `uses:` pin, and the checker
      # rejected a caller whose two pins disagreed. That check was correct and
      # kept firing, because the property it protects is one no bot can
      # maintain: Dependabot understands a SHA in a `uses:` reference and
      # updates it, while the same SHA passed as an INPUT VALUE is opaque to it.
      # Every bump therefore arrived half-applied and red until a human moved
      # the second line -- once per repository, forever.
      #
      # `github.job_workflow_sha` is the commit of the REUSABLE WORKFLOW FILE
      # this job is running, which is exactly the commit the caller pinned. So
      # the second pin is not needed: it can be derived, and a derived value
      # cannot skew from the thing it is derived from.
      #
      # IT MUST NEVER FALL BACK. An empty ref does not fail a checkout -- it
      # silently resolves the DEFAULT BRANCH, which would turn a pinned gate
      # into a mutable one, the exact opposite of what pinning is for. So an
      # unusable value is a hard error here rather than a checkout that
      # succeeds against the wrong tree.
      - name: Resolve the commit to take the checker from
        id: checker
        env:
          REQUESTED: ${{ inputs.script-ref }}
          RESOLVED: ${{ github.job_workflow_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RESOLVED" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::github.job_workflow_sha is '${RESOLVED}', not a 40-character commit."                  "The checker's commit cannot be derived, and an empty ref would check out the"                  "default branch and make this gate mutable. Refusing to run."
            exit 1
          fi

          # A caller that still passes the old input is held to it rather than
          # ignored: if the two disagree, the caller's tree says one thing and
          # this gate would do another, and silently preferring either is how a
          # reviewer ends up reading a diff that is not what ran.
          if [[ -n "$REQUESTED" && "$REQUESTED" != "$RESOLVED" ]]; then
            echo "::error::script-ref is ${REQUESTED:0:8} but this workflow was resolved at"                  "${RESOLVED:0:8}. Drop the script-ref input -- it now defaults to the"                  "resolved commit, which is why the two can no longer be made to disagree."
            exit 1
          fi

          echo "ref=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Checker will be taken from ${RESOLVED}."

      - name: Check out the shared checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 4cloudguru/shared-workflows
          ref: ${{ steps.checker.outputs.ref }}
          path: .shared-workflows
          persist-credentials: false

      # .cjs, not .js. The checker is checked out INSIDE the caller's workspace,
      # so node resolves the nearest package.json -- the CALLER'S -- to decide
      # the module system. A caller declaring "type": "module" made this
      # CommonJS file load as ESM and die with:
      #
      #   ReferenceError: require is not defined in ES module scope
      #
      # That is not a finding about the caller; it is the gate failing to run at
      # all, in a way that looks exactly like the caller failing the gate. A .cjs
      # extension is CommonJS regardless of any package.json above it.
      - name: Assert workflow-hardening invariants
        env:
          # Explicitly the checkout root. The checker defaults to its own
          # parent directory when given no argument, which would silently make
          # it audit shared-workflows instead of the caller -- a mistake that
          # produced fifteen identical "clean" results in testing before it was
          # noticed.
          TARGET: ${{ github.workspace }}
        run: node .shared-workflows/scripts/check-workflow-hardening.cjs "$TARGET"
