---
# Workflow-hardening gate, shared.
#
# Asserts that a caller's workflows enforce four properties rather than merely
# conventionally having them: every `uses:` pinned to a full SHA and LABELLED
# with the version that SHA is; every job declaring a timeout; harden-runner
# present and ahead of any other action; npm installs run with --ignore-scripts.
#
# WHY THIS IS SHARED. It existed in ONE of the fourteen repos
# (azure-pipelines-release-docs) and caught a real defect the moment a shared
# workflow pin reached it -- an unlabelled 40-hex SHA that the other twelve
# repos had accepted without complaint. A gate that lives in one repo only
# protects one repo, and the estate has repeatedly found that the repo holding
# the improvement is not the repo that needs it.
#
# It reports what it ENUMERATED as well as what it found, because a gate that
# scanned nothing exits 0 exactly like a gate that scanned everything and
# approved. Read the enumerated line before believing the verdict.

on:
  workflow_call:
    inputs:
      script-ref:
        description: >-
          Only for this repository's own `./` self-call. A remote caller passes
          nothing: the checker is taken from the commit on the caller's own
          `uses:` line, which is read from its checkout. A value a remote caller
          still passes is ignored with a warning, and can be deleted.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  workflow-hardening:
    name: Workflow hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WHICH COMMIT THE CHECKER COMES FROM. It must be the commit this workflow
      # is running at, so the gate enforces what the caller's `uses:` line says.
      # That commit is not reliably available from context: v1.22.0 read
      # `github.job_workflow_sha` and #68 reverted it, because a genuine remote
      # call saw it empty. A required `script-ref` input worked, but Dependabot
      # rewrites the `uses:` line and never the input beside it, so every bump
      # of this workflow failed until a human moved one line by hand.
      #
      # So the commit is read from the caller's own `uses:` line, in the
      # checkout above: the line that selected this workflow for this run, in
      # the commit under test. It carries no more trust than the pin already
      # did. A caller pinned at more than one commit fails closed rather than
      # picking one. Only this repository's `./` self-call has no such line,
      # and it passes `script-ref`.
      #
      # The checker is taken from shared-workflows at a pinned commit rather
      # than from the caller, so a repo cannot weaken its own gate by editing
      # its copy -- which is the failure mode of shipping the script into
      # fourteen repos.
      - name: Resolve the checker commit
        id: checker-ref
        env:
          SCRIPT_REF: ${{ inputs.script-ref }}
        run: |
          set -euo pipefail
          pins=$(grep -rhoE --include='*.yml' --include='*.yaml' \
            '^[[:space:]]*uses:[[:space:]]*4cloudguru/shared-workflows/\.github/workflows/workflow-hardening\.yml@[0-9a-f]{40}' \
            .github/workflows 2>/dev/null | grep -oE '[0-9a-f]{40}$' | sort -u || true)
          count=$(printf '%s' "$pins" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error title=workflow-hardening::.github/workflows calls workflow-hardening.yml at $count different commits ($(printf '%s' "$pins" | tr '\n' ',' | sed 's/,$//')). Pin every call to the same commit; the gate will not choose one." >&2
            exit 1
          elif [ "$count" -eq 1 ]; then
            ref=$pins
            if [ -n "$SCRIPT_REF" ] && [ "$SCRIPT_REF" != "$ref" ]; then
              echo "::warning title=workflow-hardening::script-ref (${SCRIPT_REF:0:8}) is ignored: the checker is taken from the uses: pin (${ref:0:8}). Delete the script-ref input."
            fi
          elif [ -n "$SCRIPT_REF" ]; then
            ref=$SCRIPT_REF
          else
            echo "::error title=workflow-hardening::found no uses: pin of 4cloudguru/shared-workflows/.github/workflows/workflow-hardening.yml in .github/workflows, and no script-ref was passed, so there is no commit to take the checker from." >&2
            exit 1
          fi
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=workflow-hardening::the checker commit must be a full 40-hex SHA, got '$ref'." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "checker commit: $ref"

      - name: Check out the shared checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 4cloudguru/shared-workflows
          ref: ${{ steps.checker-ref.outputs.ref }}
          path: .shared-workflows
          persist-credentials: false

      # .cjs, not .js. The checker is checked out INSIDE the caller's workspace,
      # so node resolves the nearest package.json -- the CALLER'S -- to decide
      # the module system. A caller declaring "type": "module" made this
      # CommonJS file load as ESM and die with:
      #
      #   ReferenceError: require is not defined in ES module scope
      #
      # That is not a finding about the caller; it is the gate failing to run at
      # all, in a way that looks exactly like the caller failing the gate. A .cjs
      # extension is CommonJS regardless of any package.json above it.
      - name: Assert workflow-hardening invariants
        env:
          # Explicitly the checkout root. The checker defaults to its own
          # parent directory when given no argument, which would silently make
          # it audit shared-workflows instead of the caller -- a mistake that
          # produced fifteen identical "clean" results in testing before it was
          # noticed.
          TARGET: ${{ github.workspace }}
        run: node .shared-workflows/scripts/check-workflow-hardening.cjs "$TARGET"
