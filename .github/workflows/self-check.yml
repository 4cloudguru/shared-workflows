---
# This repository lints ITSELF with the definition it publishes.
#
# WHY IT MATTERS MORE HERE THAN ANYWHERE ELSE
#
# A change to this repo executes inside the CI of every repository that calls
# it -- several of which hold `id-token: write` and release credentials. That
# makes this the most privileged repo in the estate and, until this file
# existed, the only one with no CI at all. A workflow with a schema error
# pushed here would fail at STARTUP in every caller: zero jobs, no logs, and
# unable to fail a required check because no job ran.
#
# Calling ./.github/workflows/workflow-security.yml rather than duplicating the
# jobs is deliberate. If the shared definition breaks, THIS check breaks first
# and here -- before any caller pins the broken commit. A hand-rolled copy would
# keep passing while the thing it is meant to represent was broken, which is the
# failure this whole repository exists to remove.
name: Self Check

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: ./.github/workflows/workflow-security.yml

  # The recording half, exercised here because its whole design turns on a
  # permission interaction that only shows up when a caller actually grants it.
  # If this file did not call it, the first repository to try would be finding
  # out whether the shape works -- which is the failure this repository exists to
  # take on itself first.
  workflow-security-record:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/workflow-security-record.yml

  # This repository publishes the workflow-hardening gate and did not run it.
  # Pointed at itself it reported six findings: two jobs with no timeout, two
  # never reaching harden-runner, and two harden-runner steps on audit with no
  # recorded reason. The repo that hands everyone else a gate is not exempt from
  # it, and a local `./` reference means it always runs the definition in the
  # commit under review rather than a published one.
  workflow-hardening:
    uses: ./.github/workflows/workflow-hardening.yml
    with:
      script-ref: ${{ github.sha }}

  # The footer guard is 128 lines of shell shared by nine repositories, so a
  # mistake in it is a mistake in nine places at once -- which is exactly what
  # happened: a line-anchored expression under-counted against release-please and
  # let a prose sentence naming the token propose a MAJOR version bump.
  #
  # The test EXTRACTS the script from the action rather than carrying a copy. A
  # test with its own copy passes while the real one rots, which is the failure
  # mode this whole repository exists to remove.
  # THE JOB NAME STAYS `Footer guard self-test` EVEN THOUGH IT NOW RUNS FOUR.
  # That name is a REQUIRED status context on this repository's `main`
  # (`enforce_admins: true`, so it genuinely binds). Renaming it to something
  # more accurate would silently stop a required check from reporting — which is
  # precisely the hazard the guard being added below is a composite action to
  # avoid, and this repository is not exempt from its own finding. The name is
  # a protection identifier now, not a description; the steps say what they are.
  #
  # The alternative — a new job with an honest name — would report under a
  # context nobody has required, and an unrequired new context is how a guard
  # ends up advisory. Landing it inside the already-required job means the proof
  # blocks a merge from the day it lands.
  breaking-change-footers-guard:
    name: Footer guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository and runs a
      #   node test against a shell script with a stubbed `gh`; it makes no network call
      #   of its own. harden-runner has never run in this repository on this job, so no
      #   endpoint baseline exists and a block policy written without one fails closed
      #   on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Footer guard self-test
        run: node tests/test-breaking-change-footers.js

      # This repository publishes check-workflow-hardening.cjs to three
      # extensions and had no test for it; the only mutation proof in the estate
      # sat in one consumer, against that consumer's own older copy. It runs here
      # now, beside the gate it proves.
      - name: Workflow-hardening gate self-test
        run: node tests/test-workflow-hardening.js
      # The upstream comparison runs weekly in tooling-version-drift.yml; this
      # is the logic behind it, exercised on every pull request. The canary this
      # replaces died by reading pins that had moved, so the case that matters
      # most is the one asserting that resolving NOTHING is a finding.
      - name: Tooling pin reader self-test
        run: node tests/test-tooling-pins.js

      # The release-PR closing-keyword guard, ported here so six more
      # release-please repositories can adopt it. Two kinds of proof in one
      # entry point, because it is two kinds of artifact:
      #
      #   * the action's shell bodies are EXTRACTED from action.yml and executed
      #     against a stubbed `gh`, the same way the footer guard's test extracts
      #     its `run:` block — a test carrying its own copy passes while the real
      #     one rots;
      #   * the five .mjs modules keep their five node:test suites, which import
      #     the modules directly and so have no copy to drift from. They are run
      #     with a case-count floor, because `node --test` over a directory with
      #     no test files exits 0 and reports exactly like a passing suite.
      #
      # It needs `git` (the trailer parser is `git interpret-trailers`, not a
      # reimplementation that would drift from it) and `jq`. Both are on
      # ubuntu-latest. No dependencies, so no install step.
      - name: Release-PR closing-keyword guard self-test
        run: node tests/test-release-pr-closing-keywords.js

      # The osv-scan action's own body, executed against a stubbed `docker` that
      # returns each exit code the real scanner produces. The property is that
      # 0, 1 and 127 stay three different answers: `continue-on-error` collapses
      # the last two into one `outcome` in every consumer, and the numeric code
      # is in no API field, which is how a scanner that had stopped working
      # produced the same green as a clean one for weeks
      # (terraform-registry-backend#894).
      - name: OSV scan action self-test
        run: node tests/test-osv-scan-action.js

      # The publish-marketplace action, formerly three byte-identical copies of
      # this same script in azure-pipelines-terraform, azure-pipelines-packer
      # and azure-pipelines-release-docs. Drives the REAL script at
      # .github/actions/publish-marketplace/publish-marketplace.js against a
      # fake tfx -- the same file every consumer's pinned SHA resolves to, so a
      # regression here is a regression in all three at once. Every
      # publish-shaped fixture carries tfx's real routine preamble text: the
      # regression that moved this file here (v1.15.2's release dying because a
      # genuine Gallery API timeout was misread as a duplicate-version
      # rejection) hid inside exactly the gap between what the OLD fixtures
      # simulated and what tfx actually sends on every attempt.
      - name: Publish-marketplace action self-test
        run: node tests/test-publish-marketplace.js

      # The pre-publish/pre-release cosign integrity gate, formerly a hand-copied
      # shell block in azure-pipelines-terraform and azure-pipelines-release-docs
      # (two call sites each) and missing entirely from azure-pipelines-packer.
      # Extracted from the action's own body the same way the footer guard's
      # test is, so a mutation of the real script cannot pass silently.
      - name: Verify-vsix-signature action self-test
        run: node tests/test-verify-vsix-signature.js
