---
# This repository lints ITSELF with the definition it publishes.
#
# WHY IT MATTERS MORE HERE THAN ANYWHERE ELSE
#
# A change to this repo executes inside the CI of every repository that calls
# it -- several of which hold `id-token: write` and release credentials. That
# makes this the most privileged repo in the estate and, until this file
# existed, the only one with no CI at all. A workflow with a schema error
# pushed here would fail at STARTUP in every caller: zero jobs, no logs, and
# unable to fail a required check because no job ran.
#
# Calling ./.github/workflows/workflow-security.yml rather than duplicating the
# jobs is deliberate. If the shared definition breaks, THIS check breaks first
# and here -- before any caller pins the broken commit. A hand-rolled copy would
# keep passing while the thing it is meant to represent was broken, which is the
# failure this whole repository exists to remove.
name: Self Check

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: ./.github/workflows/workflow-security.yml

  # The recording half, exercised here because its whole design turns on a
  # permission interaction that only shows up when a caller actually grants it.
  # If this file did not call it, the first repository to try would be finding
  # out whether the shape works -- which is the failure this repository exists to
  # take on itself first.
  workflow-security-record:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/workflow-security-record.yml

  # This repository publishes the workflow-hardening gate and did not run it.
  # Pointed at itself it reported six findings: two jobs with no timeout, two
  # never reaching harden-runner, and two harden-runner steps on audit with no
  # recorded reason. The repo that hands everyone else a gate is not exempt from
  # it, and a local `./` reference means it always runs the definition in the
  # commit under review rather than a published one.
  workflow-hardening:
    uses: ./.github/workflows/workflow-hardening.yml
    with:
      script-ref: ${{ github.sha }}

  # The footer guard is 128 lines of shell shared by nine repositories, so a
  # mistake in it is a mistake in nine places at once -- which is exactly what
  # happened: a line-anchored expression under-counted against release-please and
  # let a prose sentence naming the token propose a MAJOR version bump.
  #
  # The test EXTRACTS the script from the action rather than carrying a copy. A
  # test with its own copy passes while the real one rots, which is the failure
  # mode this whole repository exists to remove.
  # THE JOB NAME STAYS `Footer guard self-test` EVEN THOUGH IT NOW RUNS FOUR.
  # That name is a REQUIRED status context on this repository's `main`
  # (`enforce_admins: true`, so it genuinely binds). Renaming it to something
  # more accurate would silently stop a required check from reporting — which is
  # precisely the hazard the guard being added below is a composite action to
  # avoid, and this repository is not exempt from its own finding. The name is
  # a protection identifier now, not a description; the steps say what they are.
  #
  # The alternative — a new job with an honest name — would report under a
  # context nobody has required, and an unrequired new context is how a guard
  # ends up advisory. Landing it inside the already-required job means the proof
  # blocks a merge from the day it lands.
  breaking-change-footers-guard:
    name: Footer guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository and runs a
      #   node test against a shell script with a stubbed `gh`; it makes no network call
      #   of its own. harden-runner has never run in this repository on this job, so no
      #   endpoint baseline exists and a block policy written without one fails closed
      #   on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Footer guard self-test
        run: node tests/test-breaking-change-footers.js

      # This repository publishes check-workflow-hardening.cjs to three
      # extensions and had no test for it; the only mutation proof in the estate
      # sat in one consumer, against that consumer's own older copy. It runs here
      # now, beside the gate it proves.
      - name: Workflow-hardening gate self-test
        run: node tests/test-workflow-hardening.js
      # The upstream comparison runs weekly in tooling-version-drift.yml; this
      # is the logic behind it, exercised on every pull request. The canary this
      # replaces died by reading pins that had moved, so the case that matters
      # most is the one asserting that resolving NOTHING is a finding.
      - name: Tooling pin reader self-test
        run: node tests/test-tooling-pins.js

      # The release-PR closing-keyword guard, ported here so six more
      # release-please repositories can adopt it. Two kinds of proof in one
      # entry point, because it is two kinds of artifact:
      #
      #   * the action's shell bodies are EXTRACTED from action.yml and executed
      #     against a stubbed `gh`, the same way the footer guard's test extracts
      #     its `run:` block — a test carrying its own copy passes while the real
      #     one rots;
      #   * the five .mjs modules keep their five node:test suites, which import
      #     the modules directly and so have no copy to drift from. They are run
      #     with a case-count floor, because `node --test` over a directory with
      #     no test files exits 0 and reports exactly like a passing suite.
      #
      # It needs `git` (the trailer parser is `git interpret-trailers`, not a
      # reimplementation that would drift from it) and `jq`. Both are on
      # ubuntu-latest. No dependencies, so no install step.
      - name: Release-PR closing-keyword guard self-test
        run: node tests/test-release-pr-closing-keywords.js

      # The commit-message gate, formerly a verify.mjs hand-copied into THIRTEEN
      # repositories -- all thirteen byte-identical at the time of the move,
      # which is what made it safe to lift unchanged and is also why the fix for
      # the reference-trailer defect reached exactly one of them.
      #
      # Unlike every other action here it has a DEPENDENCY, and deliberately:
      # release-please reads commits with `@conventional-commits/parser`, so an
      # approximation of that grammar which disagrees with it would be green
      # about precisely the commits release-please drops in silence. The install
      # runs here for the same reason the action runs it -- the suite drives the
      # real verify.mjs, which imports the parser.
      - name: Install the commit-message gate's parser
        working-directory: .github/actions/commit-message-check
        run: npm ci --ignore-scripts

      - name: Commit-message gate self-test
        run: node tests/test-commit-message-check.js

      # The osv-scan action's own body, executed against a stubbed `docker` that
      # returns each exit code the real scanner produces. The property is that
      # 0, 1 and 127 stay three different answers: `continue-on-error` collapses
      # the last two into one `outcome` in every consumer, and the numeric code
      # is in no API field, which is how a scanner that had stopped working
      # produced the same green as a clean one for weeks
      # (terraform-registry-backend#894).
      - name: OSV scan action self-test
        run: node tests/test-osv-scan-action.js

      # The publish-marketplace action, formerly three byte-identical copies of
      # this same script in azure-pipelines-terraform, azure-pipelines-packer
      # and azure-pipelines-release-docs. Drives the REAL script at
      # .github/actions/publish-marketplace/publish-marketplace.js against a
      # fake tfx -- the same file every consumer's pinned SHA resolves to, so a
      # regression here is a regression in all three at once. Every
      # publish-shaped fixture carries tfx's real routine preamble text: the
      # regression that moved this file here (v1.15.2's release dying because a
      # genuine Gallery API timeout was misread as a duplicate-version
      # rejection) hid inside exactly the gap between what the OLD fixtures
      # simulated and what tfx actually sends on every attempt.
      - name: Publish-marketplace action self-test
        run: node tests/test-publish-marketplace.js

      # The pre-publish/pre-release cosign integrity gate, formerly a hand-copied
      # shell block in azure-pipelines-terraform and azure-pipelines-release-docs
      # (two call sites each) and missing entirely from azure-pipelines-packer.
      # Extracted from the action's own body the same way the footer guard's
      # test is, so a mutation of the real script cannot pass silently.
      - name: Verify-vsix-signature action self-test
        run: node tests/test-verify-vsix-signature.js

      # The documentation-overclaim gate. Until now it lived in FOUR places: a
      # `scripts/check-docs-claims.js` in each of azure-pipelines-terraform,
      # azure-pipelines-packer and azure-pipelines-release-docs, plus the
      # CANONICAL copy signature replay runs against all three from
      # security-orchestration's `remediation/gates/`. A census on 2026-09-09
      # found five of the estate's seven gate copies drifted, and twice that day
      # a fix landed in a hand-copy and never reached canonical -- which is the
      # worse direction, because the copy the REPLAY runs is the one that
      # decides whether a defect class is still open. The script here is
      # BYTE-IDENTICAL to canonical on purpose: replay's gatelib compares them.
      #
      # The cases drive the REAL script at
      # .github/actions/check-docs-claims/check-docs-claims.js, and two of them
      # are mutations rather than shapes -- a documented workflow renamed away,
      # and a file table naming a source file that is not there -- because a
      # guard nobody has watched fail is not a guard. The action's own `run:`
      # body is EXTRACTED from action.yml and executed too, the way the osv-scan
      # suite extracts its step: a wrapper that swallowed the gate's exit code
      # would leave every case above green while the consumer's check never went
      # red at all. It shells out to `git` (the git-ignore exemption is
      # `git check-ignore`, not a reimplementation that would drift from it),
      # which is on ubuntu-latest. No dependencies.
      - name: Docs-claims gate self-test
        run: node tests/test-check-docs-claims.js

      # The shared-module version-drift gate, moved here from the same four
      # places for the same reason -- and moved while its four copies were still
      # in lockstep, which is what makes this the cheap moment rather than the
      # expensive one. It refuses an extension whose sibling tasks resolve
      # DIFFERENT versions of @4cloudguru/pipeline-task-core or
      # pipeline-task-ado: one commit of azure-pipelines-terraform carried three
      # resolved versions of the former with every existing check green
      # (sethbacon/azure-pipelines-terraform#1108).
      #
      # Each of the three drift shapes is broken in turn and watched go red, and
      # the empty-universe cases are not filler: this gate meets a repository
      # with no Tasks/ tree in real life, and exit 0 over nothing must stay
      # distinguishable from exit 0 over everything. The action's `run:` body is
      # extracted and executed here too, for the same reason as above -- and one
      # case points the gate at THIS repository, because the script falls back to
      # its own parent directory when the root fails to arrive, which inside a
      # composite action would walk `.github/actions` and report clean forever.
      - name: Shared-module pin gate self-test
        run: node tests/test-check-shared-module-pins.js

      # The documented-but-unenforced-discipline gate, the third and last of the
      # logic-only gates that lived in four places at once: a
      # `scripts/check-enforced-disciplines.js` in each of the three ADO
      # extensions plus the CANONICAL copy replay runs against all three. Five
      # files rather than four, in fact -- every copy of the gate needs a copy of
      # `lib/task-dirs.js` beside it, so the estate carried EIGHT files where it
      # needed two. All eight were still byte-identical on the day of the move
      # (`cmp` clean), which is what made it the cheap moment.
      #
      # It refuses a rule that is written down and enforced by nobody: a task.json
      # execution handler no CI leg runs, an entry point excluded from coverage
      # AND loaded by no test, a documented Minor-bump rule with no machine
      # enforcing it, a Marketplace publish with the token on argv and no bounded
      # retry. Each of the ten shapes is broken in turn and watched go red.
      #
      # Two things here are unlike its two siblings above. This gate FAILS on a
      # repository with no `Tasks/` tree rather than passing quietly -- every
      # discipline it knows is a property of a task, so an empty universe is a
      # red flag and not a clean bill -- and it has no `--json` mode at all: its
      # human report is a parsed contract with security-orchestration's
      # enforced-disciplines.py. The action declares the `json` input for shape
      # parity and REFUSES it, and both halves of that are asserted here, because
      # forwarding a flag the script silently ignores is how a caller ends up
      # piping a human report into `jq`.
      - name: Enforced-disciplines gate self-test
        run: node tests/test-check-enforced-disciplines.js

      # The outbound-proxy-parity gate, the first of three that move here
      # carrying more than a script. It has been wrong TWICE -- once reporting
      # "no outbound HTTP call sites found" for a task that demonstrably makes
      # them, once attributing a locally defined function to a package because
      # the two share a name -- and both failures changed the inventory
      # silently, which is the one thing a coverage gate must not do. The suite
      # is security-orchestration's canonical `test-check-proxy-parity.js` with
      # one line changed (the path the gate resolves from), so a case rewritten
      # here rather than there is drift in the same way a re-worded comment in
      # the gate is.
      #
      # It also drives the ACTION: the extracted `run:` body is executed under
      # bash against a temp `$GITHUB_ENV`, because this composite does something
      # its three predecessors do not -- it exports its own `github.action_path`
      # for two task L0 suites to spawn the gate from. That value is asserted
      # VERBATIM, including from a relocated action directory, since `dirname`
      # on a windows-2025 action path returns `.` (measured here, in bash) and
      # would be a silently wrong answer on one OS only, inside a required
      # check.
      - name: Proxy-parity gate self-test
        run: node tests/test-check-proxy-parity.js

      # The artifact-trust gate. Same port, same action-body section, plus one
      # suite that had nowhere else to go: azure-pipelines-terraform's
      # TerraformInstallerV1 ArtifactTrustL0 describe D builds four synthetic
      # files in a temp directory and points this gate at them to prove that
      # resolving reader/writer names across an import did not stop it catching
      # a genuinely blind cache admission. Those fixtures assert nothing about
      # that repository -- they are the gate's own ladder -- so they belong
      # beside the gate, which is here. They stay in the consumer too: over
      # there they are the only live proof that what the composite exports is a
      # BINARY the suite can point anywhere and not a report of the consumer's
      # own tree.
      - name: Artifact-trust gate self-test
        run: node tests/test-check-artifact-trust.js

      # The credential fail-closed matrix. This gate is spawned under `npm test`
      # by two task L0 suites in each of the two extensions that authenticate to
      # a provider, and every one of those callers asserts on its verdicts --
      # and until this month nothing had ever watched it be wrong. Its suite was
      # written canonically in security-orchestration first, precisely so the
      # copy here has a parent to be `cp`'d from rather than a suite invented
      # beside the copy, and it runs here for the first time in any CI. Every
      # red case is the one clean fixture minus exactly one named guard, and the
      # reported totals are asserted over a fixture whose true totals are not
      # zero -- a gate hard-wiring `unguarded: 0` agrees with every measurement
      # taken over an all-guarded tree.
      - name: Auth-parity-matrix gate self-test
        run: node tests/test-auth-parity-matrix.js

      # The delegated gates live in two places on purpose -- canonical in
      # security-orchestration's remediation/gates/, and inside the composite
      # actions here -- and every composite script is a `cp` of canonical,
      # proven with `cmp` when it lands. That proof has to keep holding after it
      # lands, and this is the one place it can turn red without deadlocking the
      # order the two repositories move in (canonical first, then re-copy): a
      # pull request here that edits a composite script whose bytes are not
      # already canonical is refused. The fleet's signature-replay job runs the
      # same script advisory. The pairs come from gatelib in a checkout of
      # canonical main, so a gate registered there is covered here on the same
      # commit; a gate registered ahead of its action is skipped and said so.
      #
      # CANONICAL IS PRIVATE, so reading it takes the same App the replay uses:
      # `SUITE_READ_APP_ID` (a variable) and `SUITE_READ_APP_KEY` (a secret) on
      # THIS repository, minting a token for the installation on sethbacon.
      # `owner:` is load-bearing -- the default mints for this org and finds no
      # installation -- and `repositories:` plus `permission-contents: read`
      # narrow the token to the one thing it is spent on, which is zizmor's
      # `github-app-token` audit. The action revokes the token in its post step.
      #
      # UNTIL THOSE TWO ARE CONFIGURED HERE, THIS CHECK CANNOT RUN, AND SAYS SO
      # as a warning rather than pretending: the mint step is skipped when the
      # variable is absent, and the check below exits 0 with an annotation that
      # names the missing configuration. That is the only skip in this job and it
      # is loud on purpose. Configure the two and it becomes blocking with no
      # further edit.
      - name: Mint a read token for canonical (security-orchestration is private)
        if: ${{ vars.SUITE_READ_APP_ID != '' }}
        id: suite-read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ vars.SUITE_READ_APP_ID }}"
          private-key: "${{ secrets.SUITE_READ_APP_KEY }}"
          owner: sethbacon
          repositories: security-orchestration
          permission-contents: read

      # An anonymous clone was tried first and refused (the repository is
      # private), so the token travels as an extra header on this one command
      # rather than in the remote URL, where git would persist it in the clone's
      # config. Depth 1, main, into the runner's temp directory so nothing here
      # walks into it.
      - name: Composites are byte-identical to canonical (blocking)
        env:
          SUITE_READ_TOKEN: ${{ steps.suite-read.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${SUITE_READ_TOKEN:-}" ]; then
            echo "::warning title=byte-identity check did not run::SUITE_READ_APP_ID (variable) and SUITE_READ_APP_KEY (secret) are not configured on 4cloudguru/shared-workflows, so canonical (sethbacon/security-orchestration, private) cannot be read here. The composite-vs-canonical byte-identity check is therefore NOT enforced on this pull request; the fleet's signature-replay job still reports drift, advisory. Configure the two to make this step blocking."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$SUITE_READ_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone --quiet --depth 1 --branch main https://github.com/sethbacon/security-orchestration.git "$RUNNER_TEMP/security-orchestration"
          python3 tests/gate-identity.py --actions .github/actions --gates "$RUNNER_TEMP/security-orchestration/remediation/gates" --signatures "$RUNNER_TEMP/security-orchestration/remediation/signatures"

      # The check above is itself a guard, so it is watched failing: identical
      # passes, one byte of drift fails and names the file, an action shipped
      # without its lib fails, a gate registered ahead of its action is skipped,
      # comparing nothing fails, and --advisory turns every failure into a
      # warning at exit 0 -- against a fixture map the test controls.
      - name: Byte-identity check self-test
        run: node tests/test-gate-identity.js
