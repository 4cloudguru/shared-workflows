---
# EXPERIMENT caller for issue #18. Deliberately grants NO security-events.
name: perm-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# The caller's ceiling. security-events is absent on purpose: the called
# workflow contains a job asking for security-events: write, and the whole point
# is to find out whether asking-while-skipped is fatal.
permissions:
  contents: read

jobs:
  probe:
    uses: ./.github/workflows/perm-probe-called.yml
    with:
      enable-elevated: false
