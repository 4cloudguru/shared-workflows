---
name: Breaking-change footers survive the squash
description: >-
  Fail a pull request that would squash more than one breaking-change
  declaration into a single commit, or that carries a hyphenated token
  release-please reads as a declaration nobody wrote.

# WHY THIS IS A COMPOSITE ACTION AND NOT A REUSABLE WORKFLOW.
#
# A reusable workflow reports as `<caller-job-id> / <called-job-name>`, which
# renames the check. This guard is a REQUIRED context in
# azure-pipelines-release-docs, so converting it that way would have silently
# stopped a required check from ever reporting there -- and a required context
# that never appears is indistinguishable from one still running.
#
# A composite action is called as a STEP inside the caller's existing job, so
# the job keeps its name and the check keeps reporting under
# `Breaking-change footers survive the squash`. No branch protection moves.
#
# WHAT THIS REPLACES. A 128-line shell body duplicated across NINE repositories.
# That duplication is why one regex mistake existed in nine places at once, and
# why correcting it took nine pull requests and nine separate tests. The
# counting logic was byte-identical in all nine, which is what made it safe to
# lift unchanged.

inputs:
  gh-token:
    description: Token used to read the pull request's commits. Needs pull-requests:read.
    required: true
  pr-number:
    description: The pull request number.
    required: true
  repo:
    description: owner/repo the pull request belongs to.
    required: true
  require-release-as:
    description: >-
      Fail a pull request that declares a breaking change without a
      `Release-As:` footer naming the version to cut. Defaults to true.

      Set this false only where a breaking change already bumps the version the
      repository wants. terraform-suite-identity is the estate's one such case:
      it is pre-1.0 with bump-minor-pre-major, so release-please bumps a
      breaking change to a MINOR there already and a Release-As footer would be
      restating what the configuration says.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Count breaking-change declarations across this PR's commits
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ inputs.repo }}
        REQUIRE_RELEASE_AS: ${{ inputs.require-release-as }}
      run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha[0:7], msg: .commit.message}' > commits.ndjson

          total=0
          report=""
          strays=0
          stray_report=""
          release_as=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            sha=$(jq -r '.sha' <<<"$line")
            msg=$(jq -r '.msg' <<<"$line")
            subject=$(head -n1 <<<"$msg")

            # release-please recognises the two spellings of the token by
            # DIFFERENT rules, and they are not interchangeable. Verified
            # against release-please 17.11.1's own parser rather than its docs:
            #
            #   `BREAKING CHANGE:`, with a space, counts only where the
            #   Conventional Commits grammar sees a footer -- at the START of a
            #   line, with no leading whitespace. Mid-sentence or indented it is
            #   prose, and release-please ignores it.
            #
            #   The hyphenated spelling counts EVERYWHERE. release-please's
            #   postProcessCommits runs an UNANCHORED regex over the commit body
            #   and takes the rest of the matching line as the description, so it
            #   fires mid-sentence, indented, inside a fenced code block, and
            #   even inside a longer word such as NON-BREAKING-CHANGE:.
            #
            # Both are read out of the BODY, so the same token in the subject
            # line is not a declaration.
            #
            # Counting only line-anchored matches is what let abacdb5 through:
            # a sentence NAMING the hyphenated spelling was read as a real
            # declaration, and release-please proposed a MAJOR bump whose
            # changelog entry was the remainder of that sentence.
            body=$(tail -n +2 <<<"$msg")
            spaced=$(grep -cE '^BREAKING CHANGE:' <<<"$body" || true)
            # release-please requires a NON-EMPTY capture from
            # /BREAKING-CHANGE:\s*(.*)/ -- `if (breakingChangeMatch && breakingChangeMatch[1])`
            # -- so a token with nothing after it is not a declaration there.
            #
            # `\s` crosses NEWLINES, which narrows this a long way: a token whose
            # description sits on a later line still counts, and so does one whose
            # "description" is merely the next footer. Verified against the shipped
            # parser, not reasoned about. The ONLY shape release-please ignores is a
            # token followed by nothing but whitespace to the END of the body, so
            # exactly that one is dropped before counting.
            #
            # Without this the guard BLOCKED two shapes release-please ignores: a
            # sentence ending in the bare token, and a real footer followed by one.
            # A guard that rejects what the tool it models accepts is one people
            # route around and then delete.
            # Occurrences, not lines. The squash concatenates every body into one
            # and that regex is not global, so a second match on the same line is
            # dropped exactly as surely as one in a later commit.
            counted_body="$body"
            if [[ "$counted_body" =~ ^(.*)BREAKING-CHANGE:[[:space:]]*$ ]]; then
              counted_body="${BASH_REMATCH[1]}"
            fi
            hyphenated=$(grep -oF 'BREAKING-CHANGE:' <<<"$counted_body" | grep -c '' || true)
            anchored=$(grep -cE '^BREAKING-CHANGE:' <<<"$counted_body" || true)
            # A hyphenated token anywhere but the start of a line is a
            # declaration nobody WROTE and release-please acts on regardless.
            stray=$((hyphenated - anchored))
            footers=$((spaced + hyphenated))
            if [ "$footers" -gt 0 ]; then
              # A footer wins over the header's `!`, so they are not additive.
              n="$footers"
            elif printf '%s' "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              n=1
            else
              n=0
            fi

            if [ "$n" -gt 0 ]; then
              report="${report}  ${sha}  ${n} declaration(s)  ${subject}"$'\n'
            fi
            # Release-As, counted here because $body is already decoded. Grepping
            # commits.ndjson instead would be matching JSON-escaped text, where a
            # footer on its own line reads as a literal backslash-n and the
            # line-anchored form can never match at all.
            #
            # LINE-ANCHORED and case-insensitive: release-please reads it out of
            # the body as a footer, so accepting one this guard can see but the
            # parser would not is how a PR passes and still cuts a major.
            if grep -qiE '^Release-As:[[:space:]]*[0-9]' <<<"$body"; then
              release_as=$((release_as + 1))
            fi
            if [ "$stray" -gt 0 ]; then
              strays=$((strays + stray))
              stray_report="${stray_report}  ${sha}  ${stray} off the start of a line  ${subject}"$'\n'
            fi
            total=$((total + n))
          done < commits.ndjson

          echo "Breaking-change declarations in this PR: $total"
          if [ -n "$report" ]; then
            printf 'Where they are:\n%s' "$report"
          fi

          if [ "$strays" -gt 0 ]; then
            printf 'Not written as a footer:\n%s' "$stray_report"
            {
              echo "### A breaking change nobody declared"
              echo
              echo "This pull request carries **$strays** hyphenated breaking-change"
              echo "token(s) somewhere other than the start of a line. release-please"
              echo "matches that spelling ANYWHERE in a commit body -- mid-sentence,"
              echo "indented, inside a fenced code block -- and takes the rest of the"
              echo "line as the description. Prose that merely NAMES the token therefore"
              echo "forces a MAJOR version bump and writes a changelog entry out of the"
              echo "remainder of the sentence."
              echo
              echo '```'
              printf '%s' "$stray_report"
              echo '```'
              echo
              echo "To write ABOUT the token, drop the colon, or use the spaced spelling,"
              echo "which release-please reads only at the start of a line. To declare a"
              echo "real breaking change, put the footer at the start of its own line."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::This PR has $strays breaking-change token(s) off the start of a line; release-please reads each one as a declaration. See the job summary."
            exit 1
          fi

          # A DECLARED BREAKING CHANGE NEEDS THE VERSION IT WILL CUT.
          #
          # Under conventional versioning a BREAKING CHANGE footer bumps the
          # MAJOR. These are applications: nothing imports them, so there is no
          # Go /vN import-path requirement and the major number is signalling.
          # A release carrying one behaviour change does not announce a
          # redesign, which is what took terraform-registry-backend from 3.5.2
          # to 4.0.0 in an afternoon.
          #
          # The estate's answer is a Release-As footer naming the next minor, so
          # the cap is a per-release decision rather than a repository-wide
          # setting that also demotes every `fix:` to a minor. That convention
          # only holds if somebody notices when it is missed — and a forgotten
          # footer is invisible until the tag exists.
          #
          # LINE-ANCHORED, deliberately. release-please reads Release-As out of
          # the commit body, and accepting one this guard can see but the parser
          # would not is how a PR passes and still cuts a major. The same
          # mistake in the other direction is what abacdb5 taught this file
          # about the hyphenated token.
          if [ "$total" -eq 1 ] && [ "${REQUIRE_RELEASE_AS:-true}" = "true" ]; then
            if [ "$release_as" -eq 0 ]; then
              {
                echo "### A breaking change with no version to cut"
                echo
                echo "This pull request declares a breaking change and carries no"
                echo '`Release-As:` footer, so release-please will bump the **major**.'
                echo
                echo "That is rarely what these repositories want. They are applications:"
                echo "nothing imports them, there is no Go \`/vN\` requirement, and the major"
                echo "number is signalling. A release carrying one behaviour change does not"
                echo "announce a redesign."
                echo
                echo "Add a footer naming the next MINOR, on its own line:"
                echo
                echo '```'
                echo "BREAKING CHANGE: ...what an operator must do..."
                echo
                echo "Release-As: <current-major>.<current-minor + 1>.0"
                echo '```'
                echo
                echo "Read the current version with \`gh release list --limit 1\`."
                echo
                echo "**If a major IS intended** — a genuine redesign — say so in the PR and"
                echo "set \`require-release-as: "false"\` on this step for that merge, or"
                echo "cut the release manually."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::This PR declares a breaking change with no Release-As footer; release-please will bump the major. See the job summary."
              exit 1
            fi
            echo "OK: the breaking change names the version to cut."
          fi

          if [ "$total" -le 1 ]; then
            echo "OK: at most one declaration, so the squash loses nothing."
            exit 0
          fi

          {
            echo "### Breaking-change declarations do not survive the squash"
            echo
            echo "This PR declares **$total** breaking changes. The squash-merge"
            echo "concatenates every commit body into one commit, and release-please"
            echo "keeps only the **first** \`BREAKING CHANGE:\` footer of a commit."
            echo "The other $((total - 1)) would ship with no changelog entry and no notice."
            echo
            echo '```'
            printf '%s' "$report"
            echo '```'
            echo
            echo "Two ways out:"
            echo
            echo "1. **One PR per breaking change.** Preferred when they are independent."
            echo "2. **One footer.** Combine the declarations into a single"
            echo "   \`BREAKING CHANGE:\` footer and write each one up in the upgrade"
            echo "   guide, which is where an operator preparing an upgrade looks."
            echo
            echo "Moving the footers into separate commits within this PR does **not**"
            echo "work -- the squash concatenates them back into one commit body."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::This PR declares $total breaking changes; the squash keeps only the first. See the job summary."
          exit 1
