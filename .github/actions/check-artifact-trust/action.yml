---
name: A downloaded artifact is verified before it is trusted
description: >-
  Fail a repository that installs a downloaded tool, or admits a cached one,
  without verifying it — an unchecked checksum, a signature nobody validates, a
  cache entry re-used with no re-verification, a delegated verifier pinned below
  the floor that decides which implementation resolves.

# WHY A COMPOSITE ACTION AND NOT A REUSABLE WORKFLOW.
#
# The same record its siblings carry: a reusable workflow reports as
# `<caller-job-id> / <called-job-name>`, which RENAMES the check. Every job this
# runs in — `Check Shared Module Provenance` (azure-pipelines-packer),
# `Check Shared Module Parity` (azure-pipelines-terraform),
# `Check Version Consistency` (azure-pipelines-release-docs), and the
# `Build and Test …` matrix jobs — is or is headed for a required context on
# `main`. A composite action is a STEP in the caller's own job, so no job is
# renamed and no branch protection moves.
#
# WHY IT ALSO EXPORTS ITS OWN PATH, AND WHY A PATH RATHER THAN A REPORT.
#
# Two task L0 suites SPAWN this gate under `npm test` and assert its whole
# enumerated site set —
# `Tasks/PackerInstaller/PackerInstallerV1/Tests/ArtifactTrustL0.ts:233` and
# `Tasks/TerraformInstaller/TerraformInstallerV1/Tests/ArtifactTrustL0.ts:275`
# on their origin/mains today. A THIRD call site,
# `TerraformInstallerV1/Tests/ArtifactTrustL0.ts:534`, points this same binary
# at a `mkdtemp` fixture tree built in `beforeEach` (describe D, the cross-file
# CACHE-ADMIT ladder). That is why the action has to expose a PATH and not a
# report artefact: a report of the consumer's own repository answers nothing
# about a fixture directory that did not exist when the report was written.
#
# So this step writes `SHARED_GATE_CHECK_ARTIFACT_TRUST=<github.action_path>`
# into `$GITHUB_ENV`, VERBATIM: no `dirname`, no suffix, no concatenation. On
# windows-2025 the value is
# `D:\a\_actions\4cloudguru\shared-workflows\<sha>\.github\actions\check-artifact-trust`,
# and in Git Bash `dirname` returns `.` for that string — it contains no `/`,
# so the answer is a directory that EXISTS, silently wrong, on one OS only, in a
# required check. `${AP%/*}` returns the input unchanged for the same reason.
# Every consumer of this variable is node, whose `path` module is correct for
# the platform it runs on. Each gate exporting its own directory (rather than
# one action computing a shared parent) is also what keeps
# `gatelib.composite_pin()` able to see a true `uses:` line naming THIS action.
#
# WHAT IS STILL DONE IN BASH, SAID PLAINLY. What the paragraph above removes is
# path ARITHMETIC — there is no `dirname`, no `${AP%/*}`, no `realpath`, no
# `basename` anywhere in the body, and the self-test asserts that. What remains
# is CONCATENATION: the two `[ -f "$ACTION_PATH/…" ]` preflights (the gate and
# `lib/package-delegation.js`) and the two `node "$ACTION_PATH/…"` invocations.
# On windows-2025 those run in Git Bash against a backslashed path, producing a
# mixed-separator string that Git Bash and node both accept — but that has been
# measured on Linux against the Windows-shaped string, never on a runner.
# All of it happens BEFORE or AROUND the export, so the Step-3 canary's FIRST
# assertion is that the windows-2025 log carries this gate's own report line,
# and the `SHARED_GATE_*` read-back is only its second. Every one of these fails
# closed: a preflight that could not see the file exits 1 naming the path it
# looked at, so a Windows-only path defect is a red step with a legible message
# rather than a green one over a gate that never ran.
#
# WHY BOTH FLOOR INPUTS EXIST AND WHY THEY ARE REQUIRED.
#
# The gate exits 0 over a repository it enumerated nothing in, and "looked and
# found none" is a legitimate answer here: on azure-pipelines-release-docs this
# gate enumerates zero trust sites while reading a real source population. What
# separates that from "looked nowhere" is the DENOMINATOR, which this gate does
# report (`scanned`, the count of source files read). Hence two floors, both
# required and neither defaulted:
#
#   * `min-scanned` — the denominator. Refused below 1. This is "did the gate
#     look at anything at all".
#   * `min-sites` — the enumeration. An explicit integer >= 0. Zero is allowed
#     AND must be written out by the caller, so an honest zero is a recorded
#     measurement rather than an absent input.
#
# Both floors run AFTER the verdict run: a finding aborts before either line
# executes. Inline logic in this file may only ever turn a green into a red.
#
# THE SCRIPT HERE IS BYTE-IDENTICAL TO security-orchestration's
# `remediation/gates/check-artifact-trust.js` (sha256 `1de97be6766f…`, md5
# `da66b56ec504…`), and `lib/` TRAVELS WITH IT:
# `require('./lib/package-delegation.js')` resolves against the SCRIPT, not
# against the analysed root, so the action carries its own copy (sha256
# `6ef4c36d849e…`). That is a SECOND copy of the same lib
# `check-proxy-parity` ships, deliberately: `github.action_path` is per action,
# and an action that reached across to a sibling action's directory would
# resolve to whatever ref that sibling happened to be checked out at. Replay's
# `gatelib` compares both files and `SHARED_ACTION_ASSETS` records the pair, so
# an action shipped without `lib/` is exit 2 in every replay host at once.
# Re-wording a comment in the script here is drift: move the wording in
# canonical first, then re-copy and `cmp`.

inputs:
  root:
    description: >-
      Repository root to check. Defaults to `.`. A caller in a job that sets
      `defaults.run.working-directory` must pass `${{ github.workspace }}`
      explicitly — a composite action's steps do not inherit that default.
    required: false
    default: "."
  min-scanned:
    description: >-
      The lowest number of source files this gate can honestly have READ in this
      repository. Required, and refused below 1: zero with no denominator cannot
      tell "looked and found none" from "looked nowhere". Measured with
      `node check-artifact-trust.js <root> --json` (the `scanned` field).
    required: true
  min-sites:
    description: >-
      The lowest number of trust sites this repository can honestly enumerate.
      Required, and an explicit integer >= 0 — a repository that genuinely
      enumerates none says `0` here, and says it deliberately, because the
      denominator above is what carries the weight. Measured with
      `node check-artifact-trust.js <root> --json` (the `sites` array); record
      the date beside the value in the caller.
    required: true
  json:
    description: Emit the machine report instead of the human one.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Artifact trust
      shell: bash
      # EVERY INPUT ARRIVES THROUGH env, none through ${{ }} inside the script:
      # a `${{ inputs.root }}` spliced into a `run:` body is substituted before
      # bash sees the line, so a value carrying a quote or a semicolon becomes
      # shell rather than an argument. That is zizmor's template-injection
      # audit, a required check on this repository.
      env:
        ROOT: ${{ inputs.root }}
        JSON: ${{ inputs.json }}
        MIN_SCANNED: ${{ inputs.min-scanned }}
        MIN_SITES: ${{ inputs.min-sites }}
        ACTION_PATH: ${{ github.action_path }}
      # ZIZMOR `github-env` IS ACCEPTED HERE, INLINE AND BY NAME.
      #
      # That audit fires on any write to `$GITHUB_ENV` from a `run:` block,
      # because an attacker-controlled value written there becomes an
      # environment variable in every later step of the caller's job. It is
      # right to ask, and the answer here is measured rather than asserted: the
      # only thing this body writes is `github.action_path`, which the RUNNER
      # produces when it materialises this action at the caller's `uses:` SHA.
      # No caller input reaches the line — `ROOT`, `JSON` and the floors are
      # read but never written — and the variable name is a fixed literal. The
      # export is also the whole point of the action: two task L0 suites resolve
      # the gate from it, and a step output would move the value through a
      # caller-written `${{ steps.<id>.outputs… }}` expression, which is weaker,
      # not stronger.
      #
      # Suppressed INLINE rather than in `.github/zizmor.yml`, deliberately:
      # that file's `ignore:` entries match on BASENAME only (measured with
      # zizmor 1.30.1, the pinned version — a path entry matches nothing), so a
      # `github-env` entry there would read `action.yml` and blind this audit
      # for every composite in this repository, present and future. This marker
      # covers exactly one step in exactly one file.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail

        # `github.action_path` is the whole mechanism that pins the
        # implementation to the SHA on the caller's `uses:` line. A failure
        # here should say that, rather than surfacing as a node stack trace.
        [ -f "$ACTION_PATH/check-artifact-trust.js" ] || {
          echo "::error::check-artifact-trust.js is missing from the action at '$ACTION_PATH'." >&2
          exit 1
        }
        [ -f "$ACTION_PATH/lib/package-delegation.js" ] || {
          echo "::error::lib/package-delegation.js is missing from the action at '$ACTION_PATH'; the gate requires it and would die in module resolution, which exits 1 — the same code this gate uses for a finding." >&2
          exit 1
        }

        # Refuse an unusable floor BEFORE anything else, so a typo is a message
        # and not a silently permissive comparison.
        case "$MIN_SCANNED" in
          "" | *[!0-9]*)
            echo "::error::min-scanned must be a non-negative integer; got '$MIN_SCANNED'." >&2
            exit 1
            ;;
        esac
        [ "$MIN_SCANNED" -ge 1 ] || {
          echo "::error::min-scanned is '$MIN_SCANNED'. Zero with no denominator cannot tell 'looked and found none' from 'looked nowhere', which is the one distinction this floor exists to make." >&2
          exit 1
        }
        case "$MIN_SITES" in
          "" | *[!0-9]*)
            echo "::error::min-sites must be a non-negative integer; got '$MIN_SITES'." >&2
            exit 1
            ;;
        esac

        # Written AFTER the completeness checks, so the variable is never set
        # to a directory the gate could not have started from. `echo` is safe:
        # a runner action path contains no newline, and the heredoc form would
        # only add a delimiter to get wrong.
        echo "SHARED_GATE_CHECK_ARTIFACT_TRUST=$ACTION_PATH" >> "$GITHUB_ENV"

        args=("$ROOT")
        case "$JSON" in
          "" | false | FALSE | False | 0 | no) ;;
          *) args+=("--json") ;;
        esac

        # THE VERDICT RUN. No `|| true`, no pipe, no capture: the gate's exit
        # code IS the step's verdict, and a filter on the end of a command
        # replaces its exit code. A finding aborts here, before the floors
        # below — which is the intended order: a floor can only ever turn a
        # green into a red, never a red into a green.
        node "$ACTION_PATH/check-artifact-trust.js" "${args[@]}"

        # THE FLOORS. A second, redirected run (a redirect is not a pipe and
        # does not replace an exit code) so the caller's chosen report above is
        # untouched and machine-readable output exists to compare.
        node "$ACTION_PATH/check-artifact-trust.js" "$ROOT" --json > "$RUNNER_TEMP/check-artifact-trust.json"
        MIN_SCANNED="$MIN_SCANNED" MIN_SITES="$MIN_SITES" node -e '
          const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
          const scanned = Number(report.scanned);
          const sites = (report.sites || []).length;
          const scannedFloor = Number(process.env.MIN_SCANNED);
          const sitesFloor = Number(process.env.MIN_SITES);
          if (!(scanned >= scannedFloor)) {
            console.error(`::error::check-artifact-trust read ${scanned} source file(s), below the declared floor of ${scannedFloor}. A gate that read nothing reports the same clean result as one that read everything — decide whether the walk broke or the repository shrank, and move the number in the same change.`);
            process.exit(1);
          }
          if (!(sites >= sitesFloor)) {
            console.error(`::error::check-artifact-trust enumerated ${sites} trust site(s), below the declared floor of ${sitesFloor}. Either the gate stopped seeing this repository, or the floor is stale — decide which, and move the number in the same change that moved the count.`);
            process.exit(1);
          }
          console.log(`check-artifact-trust floors met: scanned=${scanned} >= ${scannedFloor}, sites=${sites} >= ${sitesFloor}`);
        ' "$RUNNER_TEMP/check-artifact-trust.json"
